  network: mainnet
  deploymentTarget: incluster
  resources:
    cpuRequest: "16"
    memoryRequest: "128Gi"
    cpuLimit: "32"
    memoryLimit: "128Gi"
  heimdall:
    image: "0xpolygon/heimdall-v2:0.6.0"
    seeds:
