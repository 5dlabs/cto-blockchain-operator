  erigon:
    image: "erigontech/erigon:v3.2.2"
    pruneMode: archive
    chain: bor-mainnet
  storage:
    storageClass: "csi-cinder-high-speed"
    heimdallSize: "1Ti"
    executionSize: "16Ti"
  enableMetrics: true
