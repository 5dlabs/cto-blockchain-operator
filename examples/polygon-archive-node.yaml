apiVersion: blockchain.5dlabs.io/v1alpha1
kind: PolygonNode
metadata:
  name: mainnet-archive
  namespace: default
spec:
  nodeType: archive
  network: mainnet
  deploymentTarget: incluster
  resources:
    cpuRequest: "16"
    memoryRequest: "128Gi"
    cpuLimit: "32"
    memoryLimit: "128Gi"
  heimdall:
    image: "0xpolygon/heimdall-v2:v0.6.0"
    seeds:
      - "1500161dd491b67fb1ac81868952be49e2509c9f@52.78.36.216:26656"
      - "dd4a3f1750af5765266eaa5b9c3bfd11048cd398@18.138.56.214:26656"
      - "8ea4f592ad6cc38d7532aff418d1fb97052463af@34.240.245.39:26656"
      - "e772e1fb8c3492a9570a377a5eafdb1dc53cd778@54.194.245.5:26656"
    genesisUrl: "https://raw.githubusercontent.com/maticnetwork/heimdall-v2/main/genesis/mainnet/genesis.json"
  erigon:
    image: "erigontech/erigon:v3.2.2"
    pruneMode: archive
    chain: bor-mainnet
  storage:
    storageClass: "csi-cinder-high-speed"
    heimdallSize: "1Ti"
    executionSize: "16Ti"
  enableMetrics: true
