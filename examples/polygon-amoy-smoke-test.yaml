apiVersion: blockchain.5dlabs.io/v1alpha1
kind: PolygonNode
metadata:
  name: amoy-smoke-test
spec:
  nodeType: full
  network: amoy
  deploymentTarget: incluster
  heimdall:
    image: "0xpolygon/heimdall-v2:0.6.0"
    seeds:
      - "4cd60c1d76e44b05f7dfd8bab3f447b119e87042@54.147.31.250:26656"
      - "a829b0ac8ce37e9b13e8648a9a26f40e8b46b1c1@54.204.136.182:26656"
  bor:
    image: "0xpolygon/bor:2.6.3"
    httpEnabled: true
    httpApi: "eth,net,web3,txpool,bor"
    maxPeers: 25
  # resources omitted — auto-sized to Amoy/Full defaults (4 CPU, 16Gi RAM)
  # storage: only override storageClass, sizes auto-sized (50Gi heimdall, 500Gi execution)
  storage:
    storageClass: "mayastor"
  enableMetrics: true
