apiVersion: apps/v1
kind: Deployment
metadata:
  name: cto-operator
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cto-operator
  template:
    metadata:
      labels:
        app: cto-operator
    spec:
      serviceAccountName: cto-operator
      containers:
      - name: cto-operator
        image: ghcr.io/5dlabs/cto-blockchain-operator:latest
        imagePullPolicy: Always
        env:
        - name: RUST_LOG
          value: "info,cto_blockchain_operator=debug"
        ports:
        - containerPort: 8080
          name: metrics
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
